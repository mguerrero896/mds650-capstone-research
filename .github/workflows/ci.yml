name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Hard gate: platform-independent static quality. Verified green on ubuntu.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src scripts tests
      - name: Mypy (strict)
        run: uv run mypy src scripts

  # Informational: the full suite's contract tests compare committed artifacts
  # byte-for-byte (CRLF) and assert Windows path defaults / local-store layouts,
  # so hosted runners without the D:\MDS650 store cannot be a hard gate yet.
  # Hardening this into a hermetic hard gate is tracked in
  # reports/remaining_work_investigation_20260818.md (engineering debt).
  tests-informational:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Pytest (hermetic markers; informational on hosted runners)
        run: uv run pytest -q -m "not live"
