name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Hard gate: platform-independent static quality. Verified green on ubuntu.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src scripts tests
      - name: Mypy (strict)
        run: uv run mypy src scripts

  # NOTE (2026-08-18): no hosted pytest job. The suite's contract tests compare
  # committed artifacts byte-for-byte (CRLF) and assert local-store layouts, so a
  # hosted runner cannot pass them; an "informational" failing job only generates
  # failure-notification noise. The full suite runs green locally before every
  # publish (see the per-commit evidence in the gate docs); making it a hermetic
  # hosted gate is tracked in reports/remaining_work_investigation_20260818.md.
