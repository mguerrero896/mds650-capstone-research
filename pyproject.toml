[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mds650-research-pipeline"
version = "0.1.0"
description = "Point-in-time options activity research pipeline for 30-minute realized variance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "polars>=1.35,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pyarrow>=22,<23",
  "tzdata>=2025.2,<2027",
  "scikit-learn>=1.7,<2",
  "lightgbm>=4.6,<5",
  "exchange-calendars>=4.11,<5",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
# The level-4 experiment (scripts/rp2_ext12_level4_and_tensor.py) needs a CUDA GPU and
# cannot run in hermetic CI, so torch is not a required dependency. It is declared here
# so the requirement is discoverable rather than hidden behind an ImportError:
#     uv sync --extra gpu
gpu = ["torch>=2.6,<3"]

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "jsonschema>=4.23,<5",
  "ruff>=0.14,<1",
  "pytest-timeout>=2.3,<3",
  "hypothesis>=6.100,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mds650"]
# The frozen feature sets are data the package cannot start without: importing
# mds650.rp2.panel resolves them eagerly. Without this a non-editable wheel installs
# cleanly and then fails on first import.
[tool.hatch.build.targets.wheel.force-include]
"configs/rp2_v3_feature_sets.json" = "mds650/rp2/configs/rp2_v3_feature_sets.json"

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m \"not live\""
timeout = 300
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: bounded authenticated provider probe; never a backfill",
  "e2e: fixture-only end-to-end pipeline test",
  "evidence: requires an explicit MDS650_EVIDENCE_ROOT with hashed research artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mds650", "scripts"]
mypy_path = "src"
exclude = "(^|/)(tests|notebooks)/"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

# torch lives in the optional "gpu" extra (see [project.optional-dependencies]) because
# the level-4 experiment needs a CUDA GPU and cannot run in hermetic CI. These overrides
# let the script type-check identically whether or not the extra is installed.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rp2_ext12_level4_and_tensor"
disallow_subclassing_any = false
disallow_any_unimported = false

[tool.coverage.run]
branch = true
source = ["mds650"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
fail_under = 80
