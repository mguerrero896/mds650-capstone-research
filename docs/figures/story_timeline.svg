<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2332" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#5a6b80" stop-opacity="0.55"/>
      <stop offset="0.87" stop-color="#c9d2da" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e9edf1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="430" rx="14" fill="#ffffff" stroke="#e1e6ea"/>

  <text x="48" y="58" font-size="25" font-weight="700" fill="#1a2332">Option-information content for 30-minute variance</text>
  <text x="48" y="84" font-size="15" fill="#7a8593">A strong 2024 signal, absorbed by the market — measured campaign by campaign, then sealed for two prospective reads</text>

  <!-- fading signal band = the timeline axis -->
  <rect x="110" y="205" width="1430" height="12" rx="6" fill="url(#fade)"/>

  <!-- node 1 · 2024 H2 · x=258 · below -->
  <circle cx="258" cy="211" r="8" fill="#1a2332"/>
  <line x1="258" y1="222" x2="258" y2="248" stroke="#c9d2da" stroke-width="1.5"/>
  <text x="258" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">2024 H2</text>
  <text x="258" y="288" text-anchor="middle" font-size="13" fill="#5a6570">Total B0&#8594;B2 positive</text>
  <text x="258" y="305" text-anchor="middle" font-size="13" fill="#5a6570">in 5 of 5 model families</text>

  <!-- node 2 · 2025 H1 · x=553 · above -->
  <circle cx="553" cy="211" r="8" fill="#1a2332"/>
  <line x1="553" y1="200" x2="553" y2="174" stroke="#c9d2da" stroke-width="1.5"/>
  <text x="553" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">2025 H1</text>
  <text x="553" y="148" text-anchor="middle" font-size="13" fill="#5a6570">Positive in both</text>
  <text x="553" y="165" text-anchor="middle" font-size="13" fill="#5a6570">independent families</text>

  <!-- node 3 · 2025 H2 – 2026 Q1 · x=899 · below -->
  <circle cx="899" cy="211" r="8" fill="#3d4c60"/>
  <line x1="899" y1="222" x2="899" y2="248" stroke="#c9d2da" stroke-width="1.5"/>
  <text x="899" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">2025 H2 &#8211; 2026 Q1</text>
  <text x="899" y="288" text-anchor="middle" font-size="13" fill="#5a6570">Still positive &#183; 160 sessions</text>
  <text x="899" y="305" text-anchor="middle" font-size="13" fill="#5a6570">+0.010 &#8230; +0.021 &#916;QLIKE</text>

  <!-- node 4 · 2026 H1 · x=1145 · above -->
  <circle cx="1145" cy="211" r="8" fill="#8a94a0"/>
  <line x1="1145" y1="200" x2="1145" y2="174" stroke="#c9d2da" stroke-width="1.5"/>
  <text x="1145" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">2026 H1</text>
  <text x="1145" y="148" text-anchor="middle" font-size="13" fill="#5a6570">Fading toward null</text>
  <text x="1145" y="165" text-anchor="middle" font-size="13" fill="#5a6570">decay &#8776; &#8722;0.028 / year</text>

  <!-- node 5 · Jul 2026 · x=1338 · below -->
  <circle cx="1338" cy="211" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.5"/>
  <line x1="1338" y1="222" x2="1338" y2="248" stroke="#c9d2da" stroke-width="1.5"/>
  <text x="1338" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Jul 2026</text>
  <text x="1338" y="288" text-anchor="middle" font-size="13" fill="#5a6570">Prospective holdout: NULL</text>
  <text x="1338" y="305" text-anchor="middle" font-size="13" fill="#5a6570">sealed &#183; read once</text>

  <!-- node 6 · 29 Aug 2026 · x=1387 · above -->
  <circle cx="1387" cy="211" r="8" fill="#e8a33d"/>
  <line x1="1387" y1="200" x2="1387" y2="174" stroke="#ecd9b6" stroke-width="1.5"/>
  <text x="1387" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#b57d22">29 Aug 2026</text>
  <text x="1387" y="148" text-anchor="middle" font-size="13" fill="#5a6570">Phase 8 prospective read</text>
  <text x="1387" y="165" text-anchor="middle" font-size="13" fill="#5a6570">TOST-armed &#183; sealed</text>

  <!-- node 7 · Nov 2026 · x=1515 · below -->
  <circle cx="1515" cy="211" r="8" fill="#e8a33d"/>
  <line x1="1515" y1="222" x2="1515" y2="248" stroke="#ecd9b6" stroke-width="1.5"/>
  <text x="1502" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#b57d22">Nov 2026</text>
  <text x="1502" y="288" text-anchor="middle" font-size="13" fill="#5a6570">Phase 9 read: TOTAL</text>
  <text x="1502" y="305" text-anchor="middle" font-size="13" fill="#5a6570">contribution &#183; collecting</text>

  <!-- legend -->
  <circle cx="56" cy="385" r="6" fill="#1a2332"/>
  <text x="70" y="390" font-size="13" fill="#5a6570">measured (retrospective)</text>
  <circle cx="256" cy="385" r="6" fill="#ffffff" stroke="#1a2332" stroke-width="2"/>
  <text x="270" y="390" font-size="13" fill="#5a6570">prospective null (read once)</text>
  <circle cx="480" cy="385" r="6" fill="#e8a33d"/>
  <text x="494" y="390" font-size="13" fill="#5a6570">sealed prospective reads ahead</text>
</svg>
