<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2332" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5a6b80" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#c9d2da" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9edf1" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="560" rx="14" fill="#ffffff" stroke="#e1e6ea"/>

  <text x="44" y="62" font-size="30" font-weight="700" fill="#1a2332">Option-information content, 2024 &#8594; 2026</text>
  <text x="44" y="92" font-size="17" fill="#7a8593">A strong signal absorbed by the market &#8212; then sealed for two prospective reads</text>

  <!-- fading signal band -->
  <rect x="60" y="268" width="1080" height="16" rx="8" fill="url(#fade)"/>

  <!-- 7 equally spaced nodes: x = 105 + i*165 -->

  <!-- 1 · 2024 H2 · below -->
  <circle cx="105" cy="276" r="11" fill="#1a2332"/>
  <line x1="105" y1="292" x2="105" y2="318" stroke="#c9d2da" stroke-width="2"/>
  <text x="105" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">2024 H2</text>
  <text x="105" y="372" text-anchor="middle" font-size="16" fill="#5a6570">B0&#8594;B2 positive,</text>
  <text x="105" y="393" text-anchor="middle" font-size="16" fill="#5a6570">5 of 5 families</text>

  <!-- 2 · 2025 H1 · above -->
  <circle cx="270" cy="276" r="11" fill="#1a2332"/>
  <line x1="270" y1="260" x2="270" y2="234" stroke="#c9d2da" stroke-width="2"/>
  <text x="270" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">2025 H1</text>
  <text x="270" y="187" text-anchor="middle" font-size="16" fill="#5a6570">positive in both</text>
  <text x="270" y="208" text-anchor="middle" font-size="16" fill="#5a6570">model families</text>

  <!-- 3 · 2025 H2 – 26 Q1 · below -->
  <circle cx="435" cy="276" r="11" fill="#3d4c60"/>
  <line x1="435" y1="292" x2="435" y2="318" stroke="#c9d2da" stroke-width="2"/>
  <text x="435" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">2025 H2 &#8211; 26 Q1</text>
  <text x="435" y="372" text-anchor="middle" font-size="16" fill="#5a6570">still positive,</text>
  <text x="435" y="393" text-anchor="middle" font-size="16" fill="#5a6570">160 sessions</text>

  <!-- 4 · 2026 H1 · above -->
  <circle cx="600" cy="276" r="11" fill="#8a94a0"/>
  <line x1="600" y1="260" x2="600" y2="234" stroke="#c9d2da" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">2026 H1</text>
  <text x="600" y="187" text-anchor="middle" font-size="16" fill="#5a6570">fading &#8212; decay</text>
  <text x="600" y="208" text-anchor="middle" font-size="16" fill="#5a6570">&#8722;0.028 / year</text>

  <!-- 5 · Jul 2026 · below -->
  <circle cx="765" cy="276" r="11" fill="#ffffff" stroke="#1a2332" stroke-width="3.5"/>
  <line x1="765" y1="292" x2="765" y2="318" stroke="#c9d2da" stroke-width="2"/>
  <text x="765" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">Jul 2026</text>
  <text x="765" y="372" text-anchor="middle" font-size="16" fill="#5a6570">prospective holdout:</text>
  <text x="765" y="393" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">NULL &#183; read once</text>

  <!-- 6 · 29 Aug 2026 · above -->
  <circle cx="930" cy="276" r="11" fill="#e8a33d"/>
  <line x1="930" y1="260" x2="930" y2="234" stroke="#ecd9b6" stroke-width="2"/>
  <text x="930" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#b57d22">29 Aug 2026</text>
  <text x="930" y="187" text-anchor="middle" font-size="16" fill="#5a6570">Phase 8 read</text>
  <text x="930" y="208" text-anchor="middle" font-size="16" fill="#5a6570">TOST-armed &#183; sealed</text>

  <!-- 7 · Nov 2026 · below -->
  <circle cx="1095" cy="276" r="11" fill="#e8a33d"/>
  <line x1="1095" y1="292" x2="1095" y2="318" stroke="#ecd9b6" stroke-width="2"/>
  <text x="1095" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#b57d22">Nov 2026</text>
  <text x="1095" y="372" text-anchor="middle" font-size="16" fill="#5a6570">Phase 9 read:</text>
  <text x="1095" y="393" text-anchor="middle" font-size="16" fill="#5a6570">total contribution</text>

  <!-- legend -->
  <circle cx="52" cy="490" r="8" fill="#1a2332"/>
  <text x="68" y="496" font-size="16" fill="#5a6570">measured (retrospective)</text>
  <circle cx="310" cy="490" r="8" fill="#ffffff" stroke="#1a2332" stroke-width="2.5"/>
  <text x="326" y="496" font-size="16" fill="#5a6570">prospective null (read once)</text>
  <circle cx="590" cy="490" r="8" fill="#e8a33d"/>
  <text x="606" y="496" font-size="16" fill="#5a6570">sealed prospective reads ahead</text>
</svg>
